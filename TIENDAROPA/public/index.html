<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiendaRopa</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <h1 class="logo">TiendaRopa</h1>
      <nav>
        <a href="#" data-view="catalog">Catálogo</a>
        <a href="#" data-view="login">Iniciar Sesión</a>
        <a href="#" data-view="register">Registrarse</a>
      </nav>
      <button class="cart-btn" id="cartToggleBtn" title="Carrito">
        🛒 <span id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section id="view-catalog" class="view active">
      <h2>Catálogo de Productos</h2>
      <div class="catalog-grid" id="productGrid"></div>
    </section>

    <section id="view-login" class="view">
      <div class="auth-card">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginCorreo">Correo electrónico</label>
            <input type="email" id="loginCorreo" placeholder="tucorreo@email.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <input type="password" id="loginPassword" placeholder="••••••" required>
          </div>
          <button type="submit">Entrar</button>
          <p class="auth-switch">
            ¿No tienes cuenta? <a href="#" data-view="register">Regístrate</a>
          </p>
        </form>
        <div id="loginMessage" class="message"></div>
      </div>
    </section>

    <section id="view-register" class="view">
      <div class="auth-card">
        <h2>Crear Cuenta</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="regNombre">Nombre completo</label>
            <input type="text" id="regNombre" placeholder="Tu nombre" required>
          </div>
          <div class="form-group">
            <label for="regCorreo">Correo electrónico</label>
            <input type="email" id="regCorreo" placeholder="tucorreo@email.com" required>
          </div>
          <div class="form-group">
            <label for="regPassword">Contraseña</label>
            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required>
          </div>
          <button type="submit">Registrarse</button>
          <p class="auth-switch">
            ¿Ya tienes cuenta? <a href="#" data-view="login">Inicia sesión</a>
          </p>
        </form>
        <div id="registerMessage" class="message"></div>
      </div>
    </section>

    <div class="cart-overlay" id="cartOverlay">
      <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
          <h2>Tu Carrito</h2>
          <button id="cartCloseBtn">&times;</button>
        </div>
        <div id="cartItems" class="cart-items"></div>
        <div class="cart-footer">
          <p>Total: <strong id="cartTotal">$0.00</strong></p>
          <button id="checkoutBtn" class="btn-primary">Finalizar Compra</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TiendaRopa. Todos los derechos reservados.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
